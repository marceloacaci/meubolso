name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    name: Lint + Test (Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci || npm install

      - name: Verificar sintaxe (node --check nos scripts principais)
        run: |
          for f in main.js preload.js app.js src/dominio.js src/persistencia.js; do
            node --check "$f" && echo "OK $f" || exit 1
          done
        shell: bash

      - name: Rodar testes (Vitest)
        run: npm run test
