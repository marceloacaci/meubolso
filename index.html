<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>MeuBolso</title>
  <!-- Bootstrap 5.3.3 (vendored, offline). Carregado ANTES do styles.css para
       que a paleta customizada do app sobrescreva as variáveis --bs-* do tema. -->
  <link rel="stylesheet" href="vendor/bootstrap.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Skip-link (WCAG 2.4.1): primeiro elemento focável; leva ao conteúdo -->
  <a href="#app" class="skip-link" data-i18n="a11y.pularConteudo">Pular para o conteúdo</a>

  <!-- Sidebar retrátil (navegação primária agrupada) -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-topo">
      <div class="logo">
        <span class="logo-ico" data-ico="moeda"></span>
        <span class="logo-titulo" id="app-titulo">MeuBolso</span>
      </div>
    </div>

    <button class="btn btn-primary btn-cta" data-acao="nova-divida"><span data-ico="mais"></span> <span class="cta-label" data-i18n="cta.novaDivida">Nova dívida</span></button>
    <button class="btn btn-primary btn-cta" data-acao="novo-pagamento"><span data-ico="mais"></span> <span class="cta-label" data-i18n="cta.novoPagamento">Novo pagamento</span></button>

    <nav class="sidebar-nav" aria-label="Navegação principal">
      <div class="nav-grupo">
        <span class="nav-grupo-titulo" data-i18n="nav.grupo.principal">Principal</span>
        <div class="nav nav-pills flex-column">
          <button class="nav-link tab active" data-view="painel">
            <span class="nav-ico" data-ico="painel"></span><span class="nav-label">Painel</span>
          </button>
          <button class="nav-link tab" data-view="dividas">
            <span class="nav-ico" data-ico="dividas"></span><span class="nav-label">Dívidas</span>
            <span class="nav-badge" id="badge-dividas" hidden></span>
          </button>
          <button class="nav-link tab" data-view="pagamentos">
            <span class="nav-ico" data-ico="pagamentos"></span><span class="nav-label">Pagamentos</span>
            <span class="nav-badge" id="badge-pagamentos" hidden></span>
          </button>
          <button class="nav-link tab" data-view="vencimentos">
            <span class="nav-ico" data-ico="vencimentos"></span><span class="nav-label">Vencimentos</span>
            <span class="nav-badge" id="badge-vencimentos" hidden></span>
          </button>
          <button class="nav-link tab" data-view="carteiras">
            <span class="nav-ico" data-ico="carteira"></span><span class="nav-label" data-i18n="tab.carteiras">Carteiras</span>
          </button>
          <button class="nav-link tab" data-view="recorrentes">
            <span class="nav-ico" data-ico="recorrente"></span><span class="nav-label" data-i18n="recorrentes.titulo">Recorrentes</span>
          </button>
          <button class="nav-link tab" data-view="metas">
            <span class="nav-ico" data-ico="meta"></span><span class="nav-label" data-i18n="metas.titulo">Metas</span>
          </button>
        </div>
      </div>

      <div class="nav-grupo">
        <span class="nav-grupo-titulo" data-i18n="nav.grupo.analise">Análise</span>
        <div class="nav nav-pills flex-column">
          <button class="nav-link tab" data-view="relatorio">
            <span class="nav-ico" data-ico="relatorio"></span><span class="nav-label">Relatório</span>
          </button>
          <button class="nav-link tab" data-view="juros">
            <span class="nav-ico" data-ico="dinheiro"></span><span class="nav-label" data-i18n="juros.titulo">Juros &amp; CET</span>
          </button>
          <button class="nav-link tab" data-view="simulador">
            <span class="nav-ico" data-ico="simulador"></span><span class="nav-label" data-i18n="simulador.titulo">Simulador</span>
          </button>
        </div>
      </div>

      <div class="nav-grupo">
        <span class="nav-grupo-titulo" data-i18n="nav.grupo.sistema">Sistema</span>
        <div class="nav nav-pills flex-column">
          <button class="nav-link tab" data-view="configuracoes">
            <span class="nav-ico" data-ico="config"></span><span class="nav-label">Configurações</span>
          </button>
          <button class="nav-link tab" data-view="lixeira">
            <span class="nav-ico" data-ico="lixeira"></span><span class="nav-label" data-i18n="tab.lixeira">Lixeira</span>
            <span class="nav-badge" id="badge-lixeira" hidden></span>
          </button>
          <button class="nav-link tab" data-view="sobre">
            <span class="nav-ico" data-ico="sobre"></span><span class="nav-label" data-i18n="tab.sobre">Sobre</span>
          </button>
        </div>
      </div>
    </nav>

    <div class="sidebar-perfil" id="badge-nivel" aria-label="Nível do usuário"></div>
  </aside>

  <!-- Conteúdo principal -->
  <div class="conteudo">
    <main id="app" tabindex="-1"></main>

    <!-- Rodapé rolante de dicas (estilo telejornal) -->
    <footer class="ticker" aria-label="Dicas financeiras">
      <span class="ticker-tag">Dicas</span>
      <div class="ticker-viewport">
        <div class="ticker-track" id="ticker-track"></div>
      </div>
    </footer>
  </div>

  <!-- FAB mobile (Nova dívida) -->
  <button class="fab-mobile" data-acao="nova-divida" title="Nova dívida" aria-label="Nova dívida"><span data-ico="mais"></span></button>

  <!-- Relógio de Brasília (canto inferior, não bloqueia a navegação) -->
  <div class="relogio-wrap">
    <div class="relogio-brasilia" id="relogio-brasilia" aria-hidden="true"></div>
    <button class="relogio-gear" id="btn-gear" type="button" aria-label="Configurações rápidas" aria-expanded="false" title="Configurações rápidas" data-i18n-title="config.rapidas"><span data-ico="engrenagem"></span></button>
    <div class="gear-panel hidden" id="gear-panel" role="dialog" aria-label="Configurações rápidas">
      <div class="gear-panel-titulo" data-i18n="config.aparencia">Aparência</div>
      <div class="gear-grupo" role="group" aria-label="Tema">
        <button class="gear-opt" data-tema="light" title="Tema claro" data-i18n-title="tema.claroTitle"><span data-ico="sol"></span> <span data-i18n="tema.claro">Claro</span></button>
        <button class="gear-opt" data-tema="dark" title="Tema escuro" data-i18n-title="tema.escuroTitle"><span data-ico="lua"></span> <span data-i18n="tema.escuro">Escuro</span></button>
      </div>
      <div class="gear-panel-titulo" data-i18n="config.corDestaque">Cor de destaque</div>
      <div class="gear-grupo gear-cores" role="group" aria-label="Cor de destaque">
        <button class="gear-cor" data-accent="verde"  style="--sw:#2d6a4f" title="Verde"  aria-label="Verde" data-i18n-title="cor.verde"></button>
        <button class="gear-cor" data-accent="azul"   style="--sw:#1d4ed8" title="Azul"   aria-label="Azul" data-i18n-title="cor.azul"></button>
        <button class="gear-cor" data-accent="roxo"   style="--sw:#6d28d9" title="Roxo"   aria-label="Roxo" data-i18n-title="cor.roxo"></button>
        <button class="gear-cor" data-accent="laranja" style="--sw:#c2410c" title="Laranja" aria-label="Laranja" data-i18n-title="cor.laranja"></button>
        <button class="gear-cor" data-accent="rosa"   style="--sw:#be185d" title="Rosa"   aria-label="Rosa" data-i18n-title="cor.rosa"></button>
      </div>
      <div class="gear-panel-titulo" data-i18n="config.idioma">Idioma</div>
      <div class="gear-grupo" role="group" aria-label="Idioma">
        <button class="gear-opt" data-idioma="pt" title="Português" data-i18n-title="idioma.pt"><span class="bandeira" data-ico="br"></span> PT</button>
        <button class="gear-opt" data-idioma="en" title="English" data-i18n-title="idioma.en"><span class="bandeira" data-ico="us"></span> EN</button>
        <button class="gear-opt" data-idioma="es" title="Español" data-i18n-title="idioma.es"><span class="bandeira" data-ico="es"></span> ES</button>
      </div>
      <div class="gear-panel-titulo" data-i18n="config.fonte">Fonte
        <span class="gear-fonte-btns">
          <button class="gear-opt gear-fonte" data-fonte="diminuir" title="Diminuir fonte" data-i18n-title="config.diminuirFonte"><span data-ico="setaBaixo"></span> A</button>
          <button class="gear-opt gear-fonte" data-fonte="aumentar" title="Aumentar fonte" data-i18n-title="config.aumentarFonte"><span data-ico="setaCima"></span> A</button>
        </span>
      </div>
    </div>
  </div>

  <!-- Modal (estrutura Bootstrap; abertura/fechamento continua no app.js) -->
  <div id="modal" class="modal hidden" aria-hidden="true" tabindex="-1" role="dialog" aria-modal="true">
    <div class="modal-card modal-content">
      <h2 id="modal-titulo">Título</h2>
      <form id="form-modal">
        <div id="campos-form"></div>
        <div class="form-actions modal-footer" style="border-top:none;padding:0">
          <button type="button" id="btn-cancelar" class="btn btn-ghost">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <!-- Overlay de celebração de nível (aparece ao subir de nível) -->
  <div id="levelup-overlay" class="levelup-overlay" aria-hidden="true" role="dialog" aria-label="Subiu de nível">
    <canvas id="levelup-confetti" class="levelup-confetti"></canvas>
    <div class="levelup-card" id="levelup-card">
      <div class="levelup-burst" aria-hidden="true"></div>
      <div class="levelup-ico"><span data-ico="trofeu"></span></div>
      <div class="levelup-numero" id="levelup-numero">2</div>
      <h2 class="levelup-titulo" id="levelup-titulo">Nível 2 alcançado!</h2>
      <p class="levelup-parabens" id="levelup-parabens">Parabéns! Você subiu de nível.</p>
      <p class="levelup-motivo" id="levelup-motivo">Continue progredindo para desbloquear novos títulos e recompensas!</p>
      <div class="levelup-titulo-nivel" id="levelup-titulo-nivel">Organizador</div>
      <button class="btn btn-primary levelup-btn" id="levelup-continuar" data-acao="fechar-levelup" data-i18n="nivel.continuar">Continuar</button>
    </div>
  </div>

  <!-- Vue 3 (runtime-only build, sem compiler -> nao usa new Function ->
       nao precisa de 'unsafe-eval' na CSP; templates sao render functions).
       Deve vir ANTES de app.js e de views/*.js. -->
  <script src="vendor/vue.runtime.global.prod.js"></script>
  <!-- Chart.js (vendored, offline) — gráficos de pizza/rosca com animação de
       rotação inicial, fade/load suave e efeito hoverOffset (fatias se separam
       no hover). Carregado ANTES de app.js. -->
  <script src="vendor/chart.umd.js"></script>
  <!-- Integração dos gráficos (pizza/rosca) com Chart.js. ANTES de app.js. -->
  <script src="graficos-chartjs.js"></script>
  <!-- Bootstrap bundle (Popper + JS: dropdowns, toasts, offcanvas, collapse...) -->
  <script src="vendor/bootstrap.bundle.min.js"></script>
  <!-- Biblioteca central de ícones SVG (obrigatório antes de app.js) -->
  <script src="icons.js"></script>
  <!-- Internacionalização (S3-1): dicionários pt/en/es expostos como globais
       (window.pt/en/es) e index.js monta window.I18N. Antes de app.js. -->
  <script src="src/i18n/pt.js"></script>
  <script src="src/i18n/en.js"></script>
  <script src="src/i18n/es.js"></script>
  <script src="src/i18n/index.js"></script>
  <!-- Domínio financeiro/gamificação (funções PURAS extraídas p/ testes).
       Deve vir ANTES de app.js: expõe totalDivida, totalPago, saldoDivida,
       valorPagoParcela, sincronizarParcela, resumoParcelas, nivelDe,
       progressoNivel, somaDinheiro, numDinheiro, NIVEIS em globalThis. -->
  <script src="src/dominio.js"></script>
  <script src="app.js"></script>
  <!-- Modais/confirmações (S3-3): consomem globais de app.js (t, escapeHtml,
       ICON, window.api) e expõem abrirModal/abrirConfirmacao como globais. -->
  <script src="src/ui/modais.js"></script>
  <!-- Telas de atualização do sistema (estilo comercial): consome globais de
       app.js/modais.js (t, escapeHtml, ICON, window.api) e os eventos IPC. -->
  <script src="src/ui/atualizacao.js"></script>
  <!-- Componentes de view (Vue). Carregados após app.js; registram
       window.MeuBolsoViews antes do DOMContentLoaded montar o root. -->
  <script src="views/painel.js"></script>
  <script src="views/relatorio.js"></script>
  <script src="views/backups.js"></script>
  <script src="views/conquistas.js"></script>
  <script src="views/filtros.js"></script>
  <script src="views/juros.js"></script>
  <script src="views/metas.js"></script>
  <script src="views/recorrentes.js"></script>
  <script src="views/simulador.js"></script>
  <script src="views/vencimentos.js"></script>
  <script src="views/dividas.js"></script>
  <script src="views/pagamentos.js"></script>
  <script src="views/carteiras.js"></script>
  <script src="views/gamificacao.js"></script>
  <script src="views/sobre.js"></script>
  <script src="views/lixeira.js"></script>
  <script src="views/configuracoes.js"></script>
  <!-- Relógio de Brasília (Vue puro/vanilla, independente da view) -->
  <script src="relogio.js"></script>

</html>
